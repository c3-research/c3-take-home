# Busy afternoon: steady mixed load from three tenants. The router has been
# seeing long GC pauses since the last rollout.
name: public
seed: 11
end_at: 90.0
quiesce_at: 60.0
liveness_window: 30.0
gpu: {capacity: 12, release_delay: {dist: uniform, low: 0.05, high: 0.5}}
nodes:
  - {name: router-1, class: "jobrouter.router:Router"}
  - {name: "worker-{i}", count: 4, class: "jobrouter.worker:Worker"}
service: {worker_slots: 2}
client: {target: router-1}
client_retry: {timeout: 1.0, max_attempts: 8, backoff: 0.5, retry_on: [UNAVAILABLE]}
faults:
  network:
    delay: {dist: exponential, mean: 0.005}
    drop: 0.005
  nodes:
    clocks:
      - {node: "worker-*", drift_ppm: [-1000, 1000], offset: [-0.5, 0.5]}
      - {node: "router-1", drift_ppm: [-1000, 1000], offset: [-0.5, 0.5]}
    pauses:
      - {node: "worker-*", rate_per_hour: 90, duration: [0.2, 3.0]}
      - {node: "router-1", rate_per_hour: 180, duration: [0.5, 2.5]}
  gpu:
    latency: {dist: uniform, low: 0.2, high: 1.5}
workload:
  - {repeat: 45, at: 1.0, every: 1.2, jitter: 0.4, action: submit_job, tenant: A, job_id: "a{i}", units: 1, duration: 1.0}
  - {repeat: 15, at: 1.5, every: 3.5, jitter: 1.0, action: submit_job, tenant: B, job_id: "b{i}", units: 3, duration: 2.0}
  - {repeat: 12, at: 2.0, every: 4.5, action: submit_job, tenant: C, job_id: "c{i}", units: 1, duration: 3.0}
  - {repeat: 12, at: 1.5, every: 4.5, jitter: 4.0, action: cancel_job, tenant: C, job_id: "c{i}"}
  - {repeat: 8, at: 10.0, every: 5.0, jitter: 1.0, action: job_status, tenant: B, job_id: "b{i}"}
expect:
  all_actions_resolved_by: 88.0
  no_unhandled_exceptions: true
  rpc_errors_max:
    - {dst: gpu, method: submit, code: CAPACITY, max: 0}
