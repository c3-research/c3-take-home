# Template for a case's public.yaml. Incident builders copy this file, adjust
# the workload and pick a fault profile from faults/ (fixers may swap it with
# --faults). Keep the node names: coord and worker-1..worker-N.
name: public
seed: 1
end_at: 120.0
quiesce_at: 80.0
liveness_window: 30.0
gpu: {capacity: 12, release_delay: {dist: uniform, low: 0.05, high: 0.3}}
nodes:
  - {name: coord, class: "shardmr.coordinator:Coordinator"}
  - {name: "worker-{i}", count: 4, class: "shardmr.worker:Worker"}
client: {target: coord}
client_retry: {timeout: 2.0, max_attempts: 5, backoff: 0.5, retry_on: [UNAVAILABLE]}
faults: faults/soak.yaml
workload:
  - {repeat: 16, at: 1.0, every: 3.0, jitter: 1.0, action: submit_job, tenant: A, job_id: "a{i}",
     shards: 6, records: 64, units: 1, duration: 1.0}
  - {repeat: 5, at: 4.0, every: 12.0, jitter: 2.0, action: submit_job, tenant: B, job_id: "b{i}",
     shards: 8, records: 128, units: 2, duration: 1.5}
  - {repeat: 4, at: 9.0, every: 15.0, jitter: 3.0, action: cancel_job, tenant: A, job_id: "a{i}"}
  - {repeat: 8, at: 5.0, every: 8.0, jitter: 2.0, action: job_status, tenant: A, job_id: "a{i}"}
expect:
  all_actions_resolved_by: 115.0
  no_unhandled_exceptions: true
