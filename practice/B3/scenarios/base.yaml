# Normal operation: light network loss, occasional GPU failures, one worker crash.
name: base
seed: 1
end_at: 90.0
quiesce_at: 60.0
liveness_window: 25.0
gpu: {capacity: 12, release_delay: {dist: uniform, low: 0.05, high: 0.3}}
nodes:
  - {name: coord, class: "shardmr.coordinator:Coordinator"}
  - {name: "worker-{i}", count: 3, class: "shardmr.worker:Worker"}
client: {target: coord}
client_retry: {timeout: 2.0, max_attempts: 5, backoff: 0.5, retry_on: [UNAVAILABLE]}
faults:
  network:
    delay: {dist: exponential, mean: 0.005}
    drop: 0.005
    duplicate: 0.005
  nodes:
    crashes:
      - {node: worker-2, at: 20.0, restart_after: 3.0}
  gpu:
    fail: 0.02
    lost_reply: 0.01
    latency: {dist: uniform, low: 0.5, high: 2.0}
workload:
  - {repeat: 12, at: 1.0, every: 4.0, jitter: 1.0, action: submit_job, tenant: A, job_id: "a{i}",
     shards: 6, records: 64, units: 1, duration: 1.0}
  - {repeat: 4, at: 3.0, every: 12.0, jitter: 2.0, action: submit_job, tenant: B, job_id: "b{i}",
     shards: 8, records: 128, units: 2, duration: 1.5}
  - {repeat: 2, at: 10.0, every: 20.0, jitter: 2.0, action: cancel_job, tenant: A, job_id: "a{i}"}
  - {repeat: 6, at: 6.0, every: 8.0, jitter: 2.0, action: job_status, tenant: A, job_id: "a{i}"}
expect:
  all_actions_resolved_by: 85.0
  no_unhandled_exceptions: true
