# Lossy, duplicating, reordering network with one coordinator partition.
network:
  delay: {dist: exponential, mean: 0.01}
  drop: 0.03
  duplicate: 0.03
  reorder: 0.05
  reorder_window: 0.1
  partitions:
    - {at: 30.0, until: 34.0, groups: [["coord"], ["worker-1"]]}
    - {at: 60.0, until: 62.0, groups: [["coord"], ["worker-*"]]}
gpu:
  latency: {dist: uniform, low: 0.5, high: 3.0}
