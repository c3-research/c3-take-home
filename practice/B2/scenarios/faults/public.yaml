# The profile behind the incident: GPU failures, light loss, some reordering
# and a few multi-second coordinator/worker cuts.
network:
  delay: {dist: exponential, mean: 0.005}
  drop: 0.02
  reorder: 0.2
  reorder_window: 0.2
  partitions:
    - {at: 12.0, until: 16.2, groups: [["coord"], ["worker-2"]]}
    - {at: 25.0, until: 29.2, groups: [["coord"], ["worker-3"]]}
    - {at: 38.0, until: 42.2, groups: [["coord"], ["worker-1"]]}
    - {at: 51.0, until: 55.2, groups: [["coord"], ["worker-4"]]}
gpu:
  fail: 0.15
  latency: {dist: uniform, low: 0.2, high: 0.8}
