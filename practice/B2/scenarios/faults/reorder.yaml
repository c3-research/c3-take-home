# Jittery network: half of all messages take a random detour, and each worker
# briefly loses the coordinator (under half a second) every few seconds.
network:
  delay: {dist: exponential, mean: 0.005}
  reorder: 0.5
  reorder_window: 0.2
  partitions:
    - {at: 4.00, until: 4.45, groups: [["coord"], ["worker-1"]]}
    - {at: 4.80, until: 5.25, groups: [["coord"], ["worker-2"]]}
    - {at: 5.60, until: 6.05, groups: [["coord"], ["worker-3"]]}
