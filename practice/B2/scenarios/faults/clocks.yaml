# Clock drift and offset within the deployment budget, plus process pauses.
nodes:
  clocks:
    - {node: "worker-*", drift_ppm: [-200, 200], offset: [-0.5, 0.5]}
    - {node: coord, drift_ppm: [-200, 200], offset: [-0.5, 0.5]}
  pauses:
    - {node: "worker-*", rate_per_hour: 90, duration: [0.2, 2.0]}
    - {node: coord, rate_per_hour: 30, duration: [0.2, 1.5]}
gpu:
  latency: {dist: uniform, low: 0.5, high: 3.0}
