# Baseline: steady load with light network loss and GPU faults.
name: base
seed: 1
end_at: 120.0
quiesce_at: 80.0
liveness_window: 30.0
gpu: {capacity: 12, release_delay: {dist: uniform, low: 0.05, high: 0.3}}
nodes:
  - {name: router-1, class: "jobrouter.router:Router"}
  - {name: "worker-{i}", count: 4, class: "jobrouter.worker:Worker"}
service: {worker_slots: 2}
client: {target: router-1}
client_retry: {timeout: 1.0, max_attempts: 6, backoff: 0.5, retry_on: [UNAVAILABLE]}
faults:
  network:
    delay: {dist: exponential, mean: 0.005}
    drop: 0.01
    duplicate: 0.005
  gpu:
    fail: 0.03
    lost_reply: 0.02
    accepted_reported_failed: 0.02
    latency: {dist: uniform, low: 0.2, high: 1.0}
workload:
  - {repeat: 70, at: 1.0, every: 1.0, jitter: 0.3, action: submit_job, tenant: A, job_id: "a{i}", units: 2, duration: 1.0}
  - {repeat: 25, at: 1.2, every: 3.0, jitter: 0.5, action: submit_job, tenant: B, job_id: "b{i}", units: 3, duration: 2.0}
  - {repeat: 15, at: 3.0, every: 4.0, action: submit_job, tenant: C, job_id: "c{i}", units: 1, duration: 3.0}
  - {repeat: 15, at: 4.0, every: 4.0, jitter: 3.0, action: cancel_job, tenant: C, job_id: "c{i}"}
expect:
  all_actions_resolved_by: 110.0
  no_unhandled_exceptions: true
