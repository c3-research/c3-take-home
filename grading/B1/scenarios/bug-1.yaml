name: bug-1
seed: 1
end_at: 90.0
quiesce_at: 60.0
liveness_window: 25.0
gpu:
  capacity: 32
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.3
nodes:
- name: coord
  class: shardmr.coordinator:Coordinator
- name: worker-{i}
  count: 4
  class: shardmr.worker:Worker
client:
  target: coord
client_retry:
  timeout: 2.0
  max_attempts: 5
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults: faults/stragglers.yaml
workload:
- repeat: 16
  at: 1.0
  every: 3.0
  jitter: 1.0
  action: submit_job
  tenant: A
  job_id: s{i}
  shards: 6
  records: 64
  units: 1
  duration: 0.5
expect:
  all_actions_resolved_by: 85.0
  no_unhandled_exceptions: true
