name: bug-1
seed: 1
end_at: 85.0
quiesce_at: 55.0
liveness_window: 30.0
gpu:
  capacity: 12
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.5
nodes:
- name: router-1
  class: jobrouter.router:Router
- name: worker-{i}
  count: 4
  class: jobrouter.worker:Worker
service:
  worker_slots: 2
client:
  target: router-1
client_retry:
  timeout: 1.0
  max_attempts: 8
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults:
  network:
    delay:
      dist: exponential
      mean: 0.005
    drop: 0.01
    duplicate: 0.005
    partitions:
    - at: 8.0
      until: 14.0
      groups:
      - - router-1
      - - worker-*
    - at: 20.0
      until: 26.0
      groups:
      - - router-1
      - - worker-*
    - at: 32.0
      until: 38.0
      groups:
      - - router-1
      - - worker-*
    - at: 44.0
      until: 50.0
      groups:
      - - router-1
      - - worker-*
  gpu:
    latency:
      dist: uniform
      low: 0.2
      high: 1.0
workload:
- repeat: 30
  at: 1.0
  every: 1.5
  jitter: 0.4
  action: submit_job
  tenant: A
  job_id: a{i}
  units: 2
  duration: 1.0
- repeat: 45
  at: 2.0
  every: 1.0
  action: submit_job
  tenant: C
  job_id: c{i}
  units: 1
  duration: 2.0
- repeat: 45
  at: 6.0
  every: 1.0
  jitter: 2.0
  action: cancel_job
  tenant: C
  job_id: c{i}
expect:
  all_actions_resolved_by: 83.0
  no_unhandled_exceptions: true
