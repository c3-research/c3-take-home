name: bug-3
seed: 1
end_at: 90.0
quiesce_at: 55.0
liveness_window: 30.0
gpu:
  capacity: 12
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.5
nodes:
- name: router-1
  class: jobrouter.router:Router
- name: worker-{i}
  count: 4
  class: jobrouter.worker:Worker
service:
  worker_slots: 2
client:
  target: router-1
client_retry:
  timeout: 1.0
  max_attempts: 8
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults:
  network:
    delay:
      dist: exponential
      mean: 0.005
    drop: 0.01
    partitions:
    - at: 15.0
      until: 40.0
      groups:
      - - router-1
      - - worker-*
  nodes:
    crashes:
    - node: worker-*
      at:
      - 16.0
      - 20.0
      restart_after:
      - 0.5
      - 2.0
  gpu:
    latency:
      dist: uniform
      low: 0.2
      high: 1.0
workload:
- repeat: 40
  at: 1.0
  every: 1.2
  jitter: 0.4
  action: submit_job
  tenant: A
  job_id: a{i}
  units: 2
  duration: 1.0
expect:
  all_actions_resolved_by: 88.0
  rpc_requests_per_group_max:
  - src: worker-*
    dst: router-1
    method: hello
    group_by: boot
    max: 52
  no_unhandled_exceptions: true
