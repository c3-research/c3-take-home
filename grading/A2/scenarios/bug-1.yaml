name: bug-1
seed: 1
end_at: 80.0
quiesce_at: 50.0
liveness_window: 30.0
gpu:
  capacity: 12
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.5
nodes:
- name: router-1
  class: jobrouter.router:Router
- name: worker-{i}
  count: 4
  class: jobrouter.worker:Worker
service:
  worker_slots: 2
client:
  target: router-1
client_retry:
  timeout: 1.0
  max_attempts: 8
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults:
  network:
    delay:
      dist: exponential
      mean: 0.005
  nodes:
    clocks:
    - node: router-1
      drift_ppm:
      - -1000
      - 1000
      offset:
      - -0.5
      - 0.5
    - node: worker-*
      drift_ppm:
      - -1000
      - 1000
      offset:
      - -0.5
      - 0.5
    pauses:
    - node: router-1
      rate_per_hour: 240
      duration:
      - 1.5
      - 2.5
    - node: worker-*
      rate_per_hour: 90
      duration:
      - 0.2
      - 3.0
  gpu:
    latency:
      dist: uniform
      low: 0.2
      high: 1.5
workload:
- repeat: 40
  at: 1.0
  every: 1.0
  jitter: 0.4
  action: submit_job
  tenant: A
  job_id: a{i}
  units: 1
  duration: 1.0
- repeat: 12
  at: 1.5
  every: 3.5
  jitter: 1.0
  action: submit_job
  tenant: B
  job_id: b{i}
  units: 1
  duration: 2.0
expect:
  all_actions_resolved_by: 78.0
  no_unhandled_exceptions: true
