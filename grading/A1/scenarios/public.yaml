name: public
seed: 11
end_at: 100.0
quiesce_at: 70.0
liveness_window: 30.0
gpu:
  capacity: 12
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.4
nodes:
- name: router-1
  class: jobrouter.router:Router
- name: worker-{i}
  count: 4
  class: jobrouter.worker:Worker
service:
  worker_slots: 2
client:
  target: router-1
client_retry:
  timeout: 1.0
  max_attempts: 8
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults: faults/router-restarts.yaml
workload:
- repeat: 40
  at: 1.0
  every: 1.5
  jitter: 0.4
  action: submit_job
  tenant: A
  job_id: a{i}
  units: 2
  duration: 1.0
- repeat: 15
  at: 1.5
  every: 4.0
  jitter: 1.0
  action: submit_job
  tenant: B
  job_id: b{i}
  units: 3
  duration: 2.0
- repeat: 8
  at: 3.0
  every: 2.5
  jitter: 0.5
  action: cancel_job
  tenant: D
  job_id: n{i}
- repeat: 16
  at: 40.0
  every: 1.5
  jitter: 0.3
  action: submit_job
  tenant: D
  job_id: n{i}
  units: 1
  duration: 1.5
- repeat: 6
  at: 20.0
  every: 7.0
  action: job_status
  tenant: D
  job_id: n{i}
expect:
  all_actions_resolved_by: 98.0
  no_unhandled_exceptions: true
