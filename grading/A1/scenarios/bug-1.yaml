name: bug-1
seed: 1
end_at: 80.0
quiesce_at: 50.0
liveness_window: 30.0
gpu:
  capacity: 12
  release_delay:
    dist: uniform
    low: 0.05
    high: 0.3
nodes:
- name: router-1
  class: jobrouter.router:Router
- name: worker-{i}
  count: 3
  class: jobrouter.worker:Worker
service:
  worker_slots: 2
client:
  target: router-1
client_retry:
  timeout: 1.0
  max_attempts: 8
  backoff: 0.5
  retry_on:
  - UNAVAILABLE
faults:
  network:
    delay:
      dist: exponential
      mean: 0.005
    drop: 0.01
  nodes:
    crashes:
    - node: router-1
      rate_per_hour: 150
      restart_after:
      - 0.5
      - 3.0
  gpu:
    latency:
      dist: uniform
      low: 0.2
      high: 1.0
workload:
- repeat: 20
  at: 1.0
  every: 1.5
  jitter: 0.4
  action: submit_job
  tenant: A
  job_id: a{i}
  units: 2
  duration: 1.0
- repeat: 10
  at: 2.0
  every: 1.0
  action: cancel_job
  tenant: D
  job_id: n{i}
- repeat: 10
  at: 30.0
  every: 1.0
  action: submit_job
  tenant: D
  job_id: n{i}
  units: 1
  duration: 1.0
expect:
  all_actions_resolved_by: 78.0
  no_unhandled_exceptions: true
  outcomes_min:
    ok: 24
